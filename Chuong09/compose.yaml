services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-lab09
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-lab09
    environment:
      NODE_ENV: production
      PORT: "5000"
      DB_HOST: sqlserver
      DB_PORT: "1433"
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      DB_ENCRYPT: "true"
      DB_TRUST_CERT: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "5000:5000"
    volumes:
      # Giữ file avatar upload bền vững trên host
      - ./public/uploads:/app/public/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Named volume lưu trữ dữ liệu SQL Server bền vững vượt qua lần recreate container
  sqlserver-data:

